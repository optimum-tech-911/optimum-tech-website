:root{font-family:Outfit,system-ui,sans-serif;font-synthesis:none;color:#fff2d5;background:#071624;--ink:#071624;--navy:#102b3e;--panel:#112c3d;--panel-hi:#1c3d4e;--cream:#fff2d5;--gold:#f8cb69;--coral:#ee7865;--muted:#b2c4c6;--line:#bdd1cd36;--teal:#78b8ad;--lime:#f8cb69;--cut:10px;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}body{background:var(--ink)}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{border:0;color:inherit;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}button:disabled{cursor:default;opacity:.55}button:not(:disabled):active{transform:translateY(2px)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff1b3;outline-offset:4px;box-shadow:0 0 0 7px #0a2135}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:4px}button[hidden],[hidden]{display:none!important}svg{display:block;width:24px;height:24px;flex-shrink:0}img{max-width:100%}h1,h2,h3,p{overflow-wrap:break-word}h1,h2,h3{font-weight:850}#stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:var(--ink);touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:absolute;inset:0;transform:none!important;pointer-events:none}#ui button,#ui a,#ui input,#ui select{pointer-events:auto}#stage:not([data-mode=playing]):not([data-mode=paused]) #ui{pointer-events:auto;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-color:#c7a666 #112b3b;scrollbar-width:thin}
/* Shared arcade surfaces and typography. */
.primary,.secondary,.text-button,.icon-button{min-height:44px;font-weight:800;letter-spacing:.055em;display:inline-flex;align-items:center;justify-content:center;gap:14px}
.primary,.secondary{padding:15px 22px;border-radius:0;font-size:12px;line-height:1.25;border:2px solid transparent;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.primary{min-height:54px;color:#172636;background:linear-gradient(135deg,#ffe4a0,var(--gold));box-shadow:inset 0 -4px #b68b45,inset 0 2px #fff1c7}
.primary:hover{background:#ffe3a0}.primary>span{font-size:21px;line-height:1}.secondary{background:#183747;border-color:#9eb6b449;box-shadow:inset 0 1px #f9e4b514}.secondary:hover{background:#24495a;border-color:#f8cb6990}.text-button{padding:12px 0;font-size:10px;background:transparent;border-bottom:1px solid var(--line);color:#c7d5d1}.text-button:hover{color:var(--gold);border-color:var(--gold)}
.icon-button{width:44px;height:44px;min-height:44px;flex-shrink:0;padding:0;border:1px solid #d2dcc14d;background:#0a2235e8;border-radius:0;font-size:21px;box-shadow:inset 0 1px #ffffff16,0 3px #04101b66;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}.icon-button:hover{background:#294654;border-color:var(--gold)}.icon-button.muted{opacity:.65;text-decoration:line-through}
.eyebrow,.arcade-kicker{font-family:Arcade,Outfit,sans-serif;font-size:8px;line-height:1.8;letter-spacing:.035em;color:var(--gold);font-weight:400;display:flex;align-items:center;gap:9px}.eyebrow i{width:6px;height:6px;background:var(--coral);display:block}.arcade-shell{position:relative;min-height:100%;isolation:isolate}.arcade-panel{background:linear-gradient(135deg,#183547,#0c2437);border:1px solid #d8d7b23b;box-shadow:inset 0 2px #fff2d00d,0 15px 35px #020c182b;position:relative;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}.arcade-panel:before{content:'';position:absolute;left:0;top:0;width:60px;height:3px;background:linear-gradient(90deg,var(--coral) 50%,var(--cream) 50%);pointer-events:none}
#stage:is([data-mode=map],[data-mode=settings],[data-mode=help],[data-mode=credits],[data-mode=admin]) #ui{background:linear-gradient(150deg,#102c40f7,#061624f9),url('assets/rush/monaco-night-pixel-v1.png') center/cover fixed}.topbar{position:relative;z-index:4;width:min(1320px,calc(100% - 72px));min-height:88px;margin:0 auto;padding-top:max(20px,env(safe-area-inset-top));display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px}.topbar:after{content:'';position:absolute;bottom:-1px;left:0;width:54px;height:3px;background:linear-gradient(90deg,var(--coral) 50%,var(--cream) 50%)}.section-name{font-size:12px;font-weight:800;letter-spacing:.1em}.balance{margin-left:auto;white-space:nowrap;color:var(--gold);font-size:20px;font-weight:850}.balance small{font-size:10px;font-weight:600;color:#b0c7c5}
/* Monaco pixel world is the home screen, with the playable GMK as its focal sprite. */
.arcade-home{position:relative;min-height:max(720px,100dvh);overflow:hidden;background:var(--ink);isolation:isolate}.home-scene,.home-skyline{position:absolute;inset:0;z-index:-3;overflow:hidden}.home-scene img,.home-skyline img{width:100%;height:100%;object-fit:cover;object-position:65% 50%;image-rendering:pixelated;filter:saturate(.92)}.home-scene:after,.home-skyline:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#071624f5 2%,#071624e6 30%,#0716245c 63%,#0716240a),linear-gradient(0deg,#071624 0%,#07162422 36%,#07162400 80%)}
.home-header,.arcade-home .landing-header{position:relative;width:min(1320px,calc(100% - 88px));margin:0 auto;padding-top:max(28px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:20px;z-index:3}.home-brand,.gmk-lockup{display:flex;align-items:center;gap:15px}.wordmark{cursor:pointer}.gmk-logo,.home-brand>strong{font-size:42px;font-weight:900;line-height:.9;letter-spacing:-2px;font-style:italic}.logo-slash{color:var(--coral);font-size:.9em;padding-left:4px}.gmk-lockup-sub,.home-brand>span{font-size:9px;letter-spacing:.16em;line-height:1.6;font-weight:700;border-left:1px solid #eee0bf4d;padding-left:15px}.landing-tools,.home-tools{display:flex;align-items:center;gap:8px}.riviera-label{font-family:Arcade,Outfit,sans-serif;font-size:7px;line-height:1.5;color:#e9d4a1;letter-spacing:.02em;margin-right:14px}
